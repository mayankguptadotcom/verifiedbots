id: newrelic-synthetics
name: New Relic Synthetics
operator: { name: New Relic, url: "https://newrelic.com" }
description: >-
  New Relic's synthetic-monitoring minions, which probe customer-configured
  URLs from public minion IPs. New Relic documents an X-Abuse-Info request
  header identifying the monitor and account; logs also record a
  NewRelicbot User-Agent. New Relic states the published ranges "are reserved
  for use by New Relic and cannot be used by anyone else", and publishes them
  as a JSON object keyed by monitoring location.
docs:
  - "https://docs.newrelic.com/docs/synthetics/synthetic-monitoring/administration/synthetic-public-minion-ips/"
  - "https://docs.newrelic.com/docs/synthetics/synthetic-monitoring/administration/identify-synthetic-monitoring-requests-your-app/"
category: monitoring
user_agents:
  patterns:
    - 'NewRelicbot/[\d.]+'
  instances:
    - 'Mozilla/5.0 (compatible; NewRelicbot/2.1; +http://www.newrelic.com)'
behavior: { respects_robots_txt: false }
verification:
  # New Relic's public-minion-IPs page links this S3 document as the machine
  # readable form of the table it prints. Fetched live this session: 200,
  # application/json, 1,703 bytes, 20 location keys whose values are arrays of
  # CIDR strings ("Washington, DC, USA": ["44.202.178.0/24", …]). Read with the
  # keyed_arrays format, whose "*" selector flattens every key, so a location
  # New Relic adds later is picked up rather than silently missed — which is
  # why this replaces the 63-range static snapshot it was transcribed from.
  # The feed parses to exactly those 63 ranges, address for address.
  - type: cidr_feed
    url: "https://s3.amazonaws.com/nr-synthetics-assets/nat-ip-dnsname/production/ip-ranges.json"
    format: keyed_arrays
    selector: "*"
