id: semrushbot-ba
name: SemrushBot-BA
operator: { name: Semrush, url: "https://www.semrush.com" }
description: >-
  The crawler behind Semrush's Backlink Audit tool, which helps a customer
  discover and clean up potentially dangerous backlinks in their profile.
  Semrush documents it as a robots.txt user agent separate from SemrushBot
  and publishes no IP ranges for it.
docs:
  - "https://www.semrush.com/bot/"
category: seo
user_agents:
  patterns:
    - 'SemrushBot-BA'
  instances:
    - 'Mozilla/5.0 (compatible; SemrushBot-BA; +http://www.semrush.com/bot.html)'
behavior: { respects_robots_txt: true, robots_token: SemrushBot-BA }
verification: []
