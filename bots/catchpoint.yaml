id: catchpoint
name: Catchpoint
operator: { name: "Catchpoint Systems", url: "https://www.catchpoint.com" }
description: >-
  The synthetic-monitoring agent of Catchpoint's internet performance
  monitoring platform. Its HTTP and browser tests fetch customer-selected
  endpoints from Catchpoint's public and enterprise nodes on a schedule the
  customer sets, so the traffic is configured monitoring rather than crawling.
  The operator tells customers they may identify this traffic by a user agent
  containing "catchpoint", while warning that the header can be modified and
  varies by test type.
docs:
  - "https://docs.catchpoint.com/docs/catchpoint-synthetic-monitoring-firewall-network-requirements"
category: monitoring
user_agents:
  # The operator documents the token, not a full string: "customers may
  # optionally identify or allow Catchpoint traffic using a User-Agent string
  # containing catchpoint". The instance below is the recorded one from
  # arcjet/well-known-bots (id catchpoint), whose capitalisation is why the
  # pattern accepts either case.
  patterns:
    - '[Cc]atchpoint'
  instances:
    - 'Mozilla/5.0 (X11; Linux x86_64; Catchpoint) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/75.0.3770.90 Safari/537.36'
# Customer-scheduled monitoring of endpoints the customer nominates, not
# crawling; the operator documents no robots.txt token or policy.
behavior: { respects_robots_txt: false }
# No recipe: the operator publishes no fetchable node address list. Its
# guidance is to allowlist by FQDN ("*.3gl.net" and "*.catchpoint.com", for
# enterprise-node egress rather than inbound test traffic), says "customers
# should allowlist the selected Catchpoint public node IP ranges" without
# printing them, and states that "IP allowlisting should be treated as a last
# resort or automated using Catchpoint APIs" — an authenticated API, so there
# is nothing to attach as a cidr_feed. Node IP changes are announced on
# nodestatus.catchpoint.com.
verification: []
