id: goguides-crawler
name: GoGuidesCrawler
operator: { name: "GoGuides, LLC", url: "https://www.goguides.com" }
description: >-
  The two crawlers GoGuides runs for its web-evidence service, which publishes
  machine-readable records about public websites — crawl status, first-seen
  and last-seen history, freshness and canonical matching — for people and
  automated systems that query it about a domain. GoGuidesCrawler checks
  publicly accessible pages to refresh those observations and
  GoGuidesDiscoveryBot performs limited discovery checks on supported public
  URLs. The operator states the bots request public URLs only and should not
  sign in, defeat access controls or enter private account areas.
docs:
  - "https://www.goguides.com/crawler"
category: seo
user_agents:
  # The crawler page lists the strings under "Common Log String Profiles",
  # reproduced below. Note the versions differ from arcjet's record for this
  # bot (which has GoGuidesCrawler/1.0): the operator's page documents 3.0, so
  # the pattern matches any version rather than either number.
  patterns:
    - 'GoGuidesCrawler/\d'
    - 'GoGuidesDiscoveryBot/\d'
  instances:
    - 'GoGuidesCrawler/3.0 (trust-transparency; +https://www.goguides.com/crawler)'
    - 'GoGuidesCrawler/3.0'
    - 'GoGuidesDiscoveryBot/1.0 (+https://www.goguides.com/crawler)'
# Documented, but in a hedged register worth quoting rather than paraphrasing:
# "The crawlers should honor applicable robots.txt rules for their declared
# identities" and "The crawler should stop where applicable rules disallow
# access". That is the operator's own statement of robots.txt handling; it is
# not the firmer "we obey" most entries here rest on. No opt-out token is
# spelled out in a robots.txt example, so the declared identity is used.
behavior: { respects_robots_txt: true, robots_token: GoGuidesCrawler }
# No address ranges, ASN or reverse-DNS method is published anywhere on the
# crawler page, so the entry carries no verification recipe.
verification: []
