id: mozilla-tabstack
name: Mozilla-Tabstack
operator: { name: Mozilla (Tabstack), url: "https://tabstack.ai" }
description: >-
  Fetcher for Tabstack, Mozilla's developer-facing platform for programmatic,
  AI-driven interaction with web content. Every request carries a dedicated
  user agent, and the operator documents that Tabstack respects robots.txt rules
  addressed to it, stops immediately on a disallowed path, fails fast rather
  than retrying, and caches robots.txt results to reduce follow-up requests.
docs:
  - "https://docs.tabstack.ai/trust/controlling-access"
category: ai-assistant
user_agents:
  patterns:
    - 'Mozilla-Tabstack/[\d.]+'
  instances:
    - 'Mozilla-Tabstack/1.0 (+https://tabstack.ai)'
behavior: { respects_robots_txt: true, robots_token: Mozilla-Tabstack }
verification: []
