id: smartologybot
name: SmartologyBot
operator: { name: Smartology, url: "https://smartology.net" }
description: >-
  Smartology's SmartMatch contextual advertising crawler. It reads pages on
  domains where an advertiser is buying advertising space, so that ads can be
  matched to page context; the operator states the bot is only active on a
  domain while suitable ad slots and advertiser budget exist. Smartology
  publishes its current address list and user-agent match pattern as a JSON
  document.
docs:
  - "https://smartology.net/smartologybot/"
category: seo
user_agents:
  patterns:
    - 'SmartologyBot/\d'
  instances:
    - 'SmartologyBot/1.0 (+ http://www.smartology.net/smartologybot)'
behavior: { respects_robots_txt: true }
verification:
  # "Smartology publishes its current address list … as a JSON document" —
  # https://www.smartology.net/smartologybot.json, linked from the operator's
  # bot page and fetched live this session: HTTP 200, application/json, a
  # `cidrs` array of 20 single-prefix objects ({"ipv4": "18.139.53.199/32"}).
  # Read with the `ip_objects` format, added this session for this shape; the
  # 20 prefixes are identical to the snapshot that stood here before, so this
  # replaces the hand-copied list rather than changing it.
  - type: cidr_feed
    url: "https://www.smartology.net/smartologybot.json"
    format: ip_objects
    selector: cidrs
