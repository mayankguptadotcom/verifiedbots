id: smartologybot
name: SmartologyBot
operator: { name: Smartology, url: "https://smartology.net" }
description: >-
  Smartology's SmartMatch contextual advertising crawler. It reads pages on
  domains where an advertiser is buying advertising space, so that ads can be
  matched to page context; the operator states the bot is only active on a
  domain while suitable ad slots and advertiser budget exist. Smartology
  publishes its current address list and user-agent match pattern as a JSON
  document.
docs:
  - "https://smartology.net/smartologybot/"
category: seo
user_agents:
  patterns:
    - 'SmartologyBot/\d'
  instances:
    - 'SmartologyBot/1.0 (+ http://www.smartology.net/smartologybot)'
behavior: { respects_robots_txt: true }
