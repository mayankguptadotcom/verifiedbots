id: iframely-training
name: Iframely Training Agent
operator: { name: Iframely, url: "https://iframely.com" }
description: >-
  Iframely's dedicated identity for AI-training and dataset requests made by its
  customers, kept separate from the Preview and Processing agents so publishers
  can recognise and target it on its own. Iframely documents it as fetching only
  declared metadata and links by default, with anything beyond that requiring an
  explicit publisher permission or a recognised page signal. Requests are signed
  with Web Bot Auth and carry a Forwarded header naming the customer behind it.
docs:
  - "https://iframely.com/docs/about-training"
  - "https://iframely.com/docs/allowlisting"
category: ai-crawler
user_agents:
  patterns:
    - 'Iframely-Training/[\d.]+'
  instances:
    - 'Iframely-Training/1.3.1 (+https://iframely.com/docs/about-training)'
# "It checks your robots.txt before fetching anything, following RFC 9309,
# along with the training-specific signals described in Content access" —
# /docs/about-training. No `User-agent:` token is documented on any Iframely
# page, so robots_token is omitted rather than guessed.
behavior: { respects_robots_txt: true }
verification:
  # /docs/allowlisting: "All three Iframely agents sign their requests using
  # this standard [Web Bot Authentication] ... The signature host resolves to
  # iframely.com". Fetched live this session: HTTP 200, content-type
  # application/http-message-signatures-directory+json, one Ed25519 key.
  - type: web_bot_auth
    signature_agent_url: "https://iframely.com/.well-known/http-message-signatures-directory"
  # Same two gateway lists as the other two agents — /docs/allowlisting
  # "applies identically across all three Iframely agents". Both fetched live
  # this session: text/plain, 25 IPv4 /32s and one IPv6 /56.
  - type: cidr_feed
    url: "https://iframely.com/ips-v4"
    format: text_lines
  - type: cidr_feed
    url: "https://iframely.com/ips-v6"
    format: text_lines
  # "Iframely traffic resolves to a subdomain of iframely.com. Reverse DNS
  # reliably verifies IPv4 traffic only."
  - type: rdns
    masks: ["*.iframely.com"]
