id: google-push-notifications
name: APIs-Google
operator:
  name: Google
  url: "https://www.google.com"
description: >-
  Google's agent that delivers push notification messages sent through Google
  Cloud and Google Workspace APIs (such as Pub/Sub push subscriptions and
  Google Drive resource change notifications) to subscriber endpoints
  configured by developers. It posts over HTTPS and retries failed deliveries
  on an exponential backoff schedule for up to several days, and it ignores
  robots.txt because the notifications are user-configured.
docs:
  - "https://developers.google.com/crawling/docs/crawlers-fetchers/apis-user-agent"
  - "https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers"
category: webhook
user_agents:
  patterns:
    - 'APIs-Google'
  instances:
    - 'APIs-Google (+https://developers.google.com/webmasters/APIs-Google.html)'
    - 'APIs-Google; (+https://developers.google.com/webmasters/APIs-Google.html)'
behavior:
  respects_robots_txt: false
  robots_token: APIs-Google
verification:
  # Repaired 2026-11-25: this entry pointed at special-crawlers.json, but Google
  # has moved APIs-Google into the user-triggered fetchers group. Evidence
  # fetched live this session: APIs-Google is the first member documented in the
  # body of google-user-triggered-fetchers (with its UA string) and appears on
  # the special-case page only in the left-hand navigation; and its own page,
  # crawlers-fetchers/apis-user-agent, states that "a reverse DNS lookup shows
  # the google.com or gae.googleusercontent.com domain" — gae.googleusercontent.com
  # is the hostname the verify-google-requests table ties to
  # user-triggered-fetchers.json, and never to the special-case pool (whose mask
  # is rate-limited-proxy-***-***-***-***.google.com). Both feeds below fetched
  # live: 200 application/json, prefixes shape, creationTime 2026-11-24T15:46:03
  # (1096 prefixes) and 2026-11-23T15:46:29 (504 prefixes).
  - type: cidr_feed
    url: "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json"
    format: prefixes
  - type: cidr_feed
    url: "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers-google.json"
    format: prefixes
