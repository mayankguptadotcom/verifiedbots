id: meta-externalagent
name: Meta External Agent
operator: { name: Meta, url: "https://www.meta.com" }
description: >-
  Meta's crawler for AI training data and content indexing across Meta
  products. Verified by ASN lookup (AS32934); Meta publishes no IP feed.
docs:
  - "https://developers.facebook.com/docs/sharing/webmasters/web-crawlers/"
category: ai-crawler
user_agents:
  patterns:
    - 'meta-externalagent/\d'
  instances:
    - 'meta-externalagent/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)'
    # Current form on the operator's page, re-read live 2026-11-25 at
    # developers.facebook.com/documentation/sharing/webmasters/web-crawlers
    # (the /docs/ URL now 301s there); the +URL is site-relative as printed.
    - 'meta-externalagent/1.1 (+/documentation/sharing/webmasters/web-crawlers)'
    - 'meta-externalagent/1.1'
behavior: { respects_robots_txt: true, robots_token: meta-externalagent }
verification:
  - type: asn
    numbers: [32934]
