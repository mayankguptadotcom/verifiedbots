id: elevenlabs-crawler
name: ElevenlabsCrawler
operator: { name: ElevenLabs, url: "https://elevenlabs.io" }
description: >-
  ElevenLabs' training crawler, which collects publicly available web content
  that may be used to train the company's generative AI models. ElevenLabs
  documents that disallowing this token in robots.txt indicates a site's content
  should not be used for training, and that robots.txt changes take effect within
  about 24 hours. It is configured independently of ElevenlabsBot.
docs:
  - "https://elevenlabs.io/docs/bots"
category: ai-crawler
user_agents:
  patterns:
    - 'ElevenlabsCrawler/\d'
  instances:
    - 'Mozilla/5.0 (compatible; ElevenlabsCrawler/1.0; +https://elevenlabs.io/docs/bots)'
behavior: { respects_robots_txt: true, robots_token: ElevenlabsCrawler }
# Tier 3: the operator's bots page documents the user agents and robots.txt
# tokens only. No IP list, ASN, reverse-DNS pattern or key directory is
# published anywhere in the ElevenLabs documentation index (checked this
# session against elevenlabs.io/docs/llms.txt).
verification: []
