id: yandex-ontodb
name: YandexOntoDB
operator: { name: Yandex, url: "https://yandex.com" }
description: >-
  The Yandex information card robot, which fetches pages used to build the
  object cards Yandex shows in search results. Yandex's robot table records
  that it follows the general robots.txt rules.
docs:
  - "https://yandex.com/support/webmaster/robot-workings/check-yandex-robots.html"
category: search-engine
user_agents:
  patterns:
    - 'YandexOntoDB/\d'
  instances:
    - 'Mozilla/5.0 (compatible; YandexOntoDB/1.0; +http://yandex.com/bots)'
behavior: { respects_robots_txt: true, robots_token: YandexOntoDB }
verification:
  - type: rdns
    masks: ["*.yandex.ru", "*.yandex.net", "*.yandex.com"]
