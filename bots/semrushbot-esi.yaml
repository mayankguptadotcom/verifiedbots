id: semrushbot-esi
name: SemrushBot-ESI
operator: { name: Semrush, url: "https://www.semrush.com" }
description: >-
  The crawler for Semrush Enterprise Site Intelligence, which analyses a
  customer's site for on-page SEO, technical and usability issues. Semrush
  documents it as its own robots.txt user agent, separate from the SiteAuditBot
  used by the standard Site Audit tool, and publishes no IP ranges for it.
docs:
  - "https://www.semrush.com/bot/"
category: seo
user_agents:
  patterns:
    - 'SemrushBot-ESI'
  instances:
    - 'SemrushBot-ESI'
behavior: { respects_robots_txt: true, robots_token: SemrushBot-ESI }
verification: []
