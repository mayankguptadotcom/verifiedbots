id: artemis-web-reader
name: Artemis Web Reader
operator: { name: Artemis (jamesg.blog), url: "https://artemis.jamesg.blog" }
description: >-
  The feed poller behind Artemis, a hosted web reader that follows websites and
  blogs on behalf of its subscribers. It updates once per day and uses HEAD and
  conditional GET requests with If-Modified-Since and If-None-Match to reduce
  bandwidth. Artemis publishes the addresses it polls feeds from as a
  plain-text list.
docs:
  - "https://artemis.jamesg.blog/bot"
category: feed-fetcher
user_agents:
  patterns:
    - 'artemis web reader/\d'
  instances:
    - 'artemis web reader/1.0 - https://artemis.jamesg.blog/bot'
behavior: { respects_robots_txt: false }
verification:
  - type: cidr_feed
    url: "https://artemis.jamesg.blog/ips.txt"
    format: text_lines
