id: linerbot
name: LinerBot
operator: { name: Liner, url: "https://liner.com" }
description: >-
  Web crawler operated by Liner, an AI search and research assistant. It
  builds and refreshes the index behind Liner's search and reference features
  — paper metadata, citations and DOI resolution — so Liner's agents can
  retrieve and cite pages. Liner's crawler page documents the user agent and
  robots.txt token, gives worked examples for a full disallow and for
  path-scoped rules, and states that rules naming LinerBot do not apply to its
  on-demand sibling Liner-User. Both agents sign their requests with HTTP
  Message Signatures under separate keys; Liner publishes no address ranges
  for either.
docs:
  - "https://liner-bot.liner.com/docs/liner-bot"
  - "https://docs.getliner.com/docs/linerbot"
category: ai-crawler
user_agents:
  # Re-read this run on both hosts above, which now serve the same rewritten
  # page. The documented reference URL inside the string moved from
  # docs.getliner.com to liner-bot.liner.com with that rewrite; the instance
  # below is the one the operator documents now.
  patterns:
    - 'LinerBot/\d'
  instances:
    - 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; LinerBot/1.0; +https://liner-bot.liner.com/docs/liner-bot)'
behavior: { respects_robots_txt: true, robots_token: LinerBot }
verification:
  # Changed this run, and the reason is on the record rather than inferred.
  # Liner withdrew its address feed: the page's "IP address ranges" section now
  # reads "We do not currently publish IP ranges for LinerBot or Liner-User, so
  # our IP range list is intentionally empty", and the feed this entry used to
  # cite (https://docs.getliner.com/linerbot.json, ten /32s when first sourced)
  # returns `"prefixes": []` with creationTime 2026-10-20 — confirmed live this
  # run at both that URL and https://liner-bot.liner.com/linerbot.json. An
  # empty feed verifies nothing, so the cidr_feed recipe is replaced by the
  # signature directory the operator now points verifiers at:
  # 'Signature-Agent: "https://liner-bot.liner.com"', keys at the URL below
  # (fetched live: HTTP 200,
  # content-type application/http-message-signatures-directory+json).
  - type: web_bot_auth
    signature_agent_url: "https://liner-bot.liner.com/.well-known/http-message-signatures-directory"
