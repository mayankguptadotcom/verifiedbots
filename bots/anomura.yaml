id: anomura
name: Anomura
operator: { name: Direqt, url: "https://www.direqt.ai" }
description: >-
  Direqt's search crawler, which discovers links and metadata to surface in
  Direqt's search features. The operator states it is not used to crawl content
  for model training, documents the robots.txt token Anomura, and publishes the
  two addresses the crawler requests come from on its crawler documentation
  page, saying it will update that page if more are added.
docs:
  - "https://docs.direqt-search.com/direqt-bots/direqt-crawlers-and-user-agents"
category: search-engine
user_agents:
  patterns:
    - 'Anomura/\d'
  instances:
    - 'Anomura/1.2 (+https://www.direqt.ai)'
    - 'Anomura/1.2 (+https://www.direqt-search.com)'
behavior: { respects_robots_txt: true, robots_token: Anomura }
verification:
  # Was a cidr_feed on https://www.direqt.ai/crawler.json, which now returns
  # HTTP 404 — the operator's docs page still links it, but the JSON is gone
  # and direqt-search.com does not resolve, so the feed was dropped. These are
  # the addresses the docs page prints inline under "Source IP ranges".
  - type: static_cidrs
    cidrs:
      - "34.56.242.161/32"
      - "35.224.164.246/32"
  # No rdns recipe: the page labels each address with a "Hostname"
  # (crawler.direqt.ai / crawler.direqt-search.com), but those are forward
  # names only — both addresses reverse to *.bc.googleusercontent.com.
