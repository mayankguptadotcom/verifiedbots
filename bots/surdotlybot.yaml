id: surdotlybot
name: SurdotlyBot
operator: { name: Sur.ly, url: "https://sur.ly" }
description: >-
  Sur.ly's crawler. The operator runs a spam-fighting link-safety service and
  uses this bot to fetch third-party sites and build a short security profile
  for each one, querying metadata and favicons and taking a screenshot of the
  homepage. The operator states it never harvests e-mail addresses or content
  unrelated to security.
docs:
  - "https://sur.ly/bot.html"
category: security
user_agents:
  patterns:
    - 'SurdotlyBot'
  instances:
    - 'Mozilla/5.0 (compatible; SurdotlyBot/1.0; +http://sur.ly/bot.html; Linux; Android 4; iPhone; CPU iPhone OS 6_0_1 like Mac OS X)'
behavior: { respects_robots_txt: true, robots_token: SurdotlyBot }
verification: []
