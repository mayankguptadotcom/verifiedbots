id: petalbot
name: PetalBot
operator: { name: Huawei, url: "https://www.huawei.com" }
description: >-
  Huawei's web crawler, fetching pages for the Petal Search engine used in
  Huawei's mobile services and for Huawei Assistant content recommendations.
  Huawei documents reverse-DNS verification against aspiegel.com and
  petalsearch.com hostnames.
docs:
  # aspiegel.com/petalbot 404s as of 2026-09-27 (checked with and without a
  # trailing slash, and on www). The replacement is the URL PetalBot's own user
  # agent advertises; it answers 200 but renders its text with JavaScript, so
  # the fields below stay as previously sourced from the Aspiegel page.
  - "https://webmaster.petalsearch.com/site/petalbot"
category: search-engine
user_agents:
  patterns:
    - 'PetalBot'
  instances:
    - 'Mozilla/5.0 (compatible;PetalBot;+https://webmaster.petalsearch.com/site/petalbot)'
    - 'Mozilla/5.0 (Linux; Android 7.0;) AppleWebKit/537.36 (KHTML, like Gecko) Mobile Safari/537.36 (compatible; PetalBot;+https://webmaster.petalsearch.com/site/petalbot)'
behavior: { respects_robots_txt: true, robots_token: PetalBot }
verification:
  - type: rdns
    masks: ["*.petalsearch.com", "*.aspiegel.com"]
