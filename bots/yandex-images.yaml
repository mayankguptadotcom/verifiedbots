id: yandex-images
name: YandexImages
operator: { name: Yandex, url: "https://yandex.com" }
description: >-
  Yandex's image-indexing robot, which fetches images so they can be displayed
  in Yandex Images. Yandex documents it as a separate robot from YandexBot and
  lists it as following robots.txt directives.
docs:
  - "https://yandex.com/support/webmaster/robot-workings/check-yandex-robots.html"
category: search-engine
user_agents:
  patterns:
    - 'YandexImages/\d'
  instances:
    - 'Mozilla/5.0 (compatible; YandexImages/3.0; +http://yandex.com/bots)'
behavior: { respects_robots_txt: true, robots_token: YandexImages }
verification:
  - type: rdns
    masks: ["*.yandex.ru", "*.yandex.net", "*.yandex.com"]
