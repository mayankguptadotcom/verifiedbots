id: kimi-searchbot
name: Kimi-SearchBot
operator: { name: Moonshot AI, url: "https://www.moonshot.ai" }
description: >-
  Moonshot AI's search crawler for Kimi, which analyses pages for relevance and
  builds the index behind Kimi's search features. Blocking it removes a site
  from Kimi search results. Listed separately from KimiBot because Moonshot
  documents it as an independently configurable crawler with its own robots.txt
  token and its own published address list.
docs:
  - "https://www.kimi.ai/policies/kimi-crawlers"
category: ai-crawler
user_agents:
  patterns:
    - 'Kimi-SearchBot/\d'
  instances:
    - 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; Kimi-SearchBot/1.0; +https://www.kimi.com/policies/kimi-crawlers'
behavior: { respects_robots_txt: true, robots_token: Kimi-SearchBot }
verification:
  - type: cidr_feed
    url: "https://www.kimi.ai/policies/kimi-searchbot.json"
    format: prefixes
