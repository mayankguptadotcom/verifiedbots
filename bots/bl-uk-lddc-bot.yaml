id: bl-uk-lddc-bot
name: bl.uk_lddc_bot
operator:
  name: The British Library (UK legal deposit libraries)
  url: "https://www.bl.uk"
description: >-
  The web crawler of the UK legal deposit libraries, which harvests
  UK-published websites so that the British Library and the other five legal
  deposit libraries can archive online publications as they are entitled to do
  under legal deposit. It runs on Heritrix and is throttled to avoid taking too
  much bandwidth or overloading a site. A separate rendering component
  identifies itself as bl.uk_lddc_renderbot. The libraries state the crawler
  generally follows the robots.txt exclusion protocol and normally respects
  robots META tags, but that they may choose to overrule robots.txt in order to
  harvest content successfully — for example to collect JavaScript or CSS that
  robots.txt excludes. No IP ranges are published, so requests cannot be
  verified; the guidance for publishers who want to stop the crawl is to name
  it in robots.txt.
docs:
  - "https://www.bl.uk/services/legal-deposit/web-archiving"
  - "https://www.nls.uk/guides/publishers/web-harvesting"
category: archiver
user_agents:
  # The National Library of Scotland's publisher guidance states the crawler's
  # "User Agent will identify itself 'bl.uk_lddc_bot'". The renderer instance
  # below is a recorded string from arcjet/well-known-bots; its +URL is the
  # British Library's former legal-deposit webmaster FAQ, which now 404s (the
  # live page is the one cited above).
  patterns:
    - 'bl\.uk_lddc_bot'
    - 'bl\.uk_lddc_renderbot'
  instances:
    - 'bl.uk_lddc_bot'
    - 'Mozilla/5.0 (Unknown; Linux x86_64) AppleWebKit/538.1 (KHTML, like Gecko) PhantomJS/2.1.1 Safari/538.1 bl.uk_lddc_renderbot/2.0.0 (+ http://www.bl.uk/aboutus/legaldeposit/websites/websites/faqswebmaster/index.html)'
behavior: { respects_robots_txt: true, robots_token: "bl.uk_lddc_bot" }
verification: []
