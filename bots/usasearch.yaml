id: usasearch
name: usasearch (SearchGov)
operator:
  name: U.S. General Services Administration (Technology Transformation Services)
  url: "https://www.gsa.gov"
description: >-
  The crawler for SearchGov (formerly Search.gov), the search service GSA's
  Technology Transformation Services runs for U.S. federal, state and local
  government websites. It indexes publicly accessible content only — the
  operator tells agencies not to register domains that serve secure content
  such as intranets — and agencies are told to allow it in robots.txt and to
  allowlist its two published source addresses. GSA's guidance names the user
  agent and the addresses but offers no feed or reverse-DNS method, so the
  addresses are recorded as static ranges.
docs:
  - "https://digital.gov/guides/search/optimize"
  - "https://digital.gov/guides/search/about"
category: search-engine
user_agents:
  # GSA's own guidance is the only source for the token: "Make sure your
  # robots.txt file allows the SearchGov user agent (usasearch) to access your
  # content." No fuller instance string is published anywhere operator-authored
  # and the token is absent from arcjet/well-known-bots, so the documented
  # token is recorded as-is (as with bl.uk_lddc_bot and amazon-kendra).
  patterns:
    - 'usasearch'
  instances:
    - 'usasearch'
behavior: { respects_robots_txt: true, robots_token: usasearch }
verification:
  # Same sentence of the operator's guidance: "Also add their IP addresses
  # (23.22.149.231 and 35.169.255.4) to your allowlist." Two bare addresses,
  # read live from digital.gov this run and recorded as /32s. Note that
  # search.gov itself now 301s to digital.gov/guides/search, which is where
  # the crawler guidance moved.
  - type: static_cidrs
    cidrs:
      - "23.22.149.231/32"
      - "35.169.255.4/32"
