id: mackerel-monitor
name: mackerel-http-checker
operator: { name: "Hatena Co., Ltd.", url: "https://www.hatena.ne.jp/" }
description: >-
  The prober behind Mackerel's external URL monitoring. Mackerel is Hatena's
  hosted server-monitoring service; when a customer configures an external URL
  monitor, Mackerel requests that URL from its own servers on a schedule and
  alerts the customer when the response fails their conditions. It checks only
  the URLs a customer has configured and does not crawl or follow links.
  Hatena publishes the address ranges Mackerel sends from as a
  machine-readable feed covering both webhook notifications and these
  monitoring requests.
docs:
  - "https://mackerel.io/docs/entry/external-monitoring"
  - "https://mackerel.io/ja/docs/entry/spec/metadata"
category: monitoring
user_agents:
  # The operator prints the default identity with a version placeholder: "If
  # User-Agent is not specified, `User-Agent: mackerel-http-checker/x.y.z` will
  # be sent (`x.y.z` means version number)". The version varies per release, so
  # the pattern anchors on the fixed prefix rather than a whole string — the
  # same treatment as amazon-bedrock-knowledgebase-on-behalf-of in
  # amazon-bedrock-crawler. The instance is the string as Hatena prints it; no
  # concrete version is published and arcjet has no Mackerel record. Customers
  # may set their own User-Agent header, so this identifies the default only.
  patterns:
    - 'mackerel-http-checker/'
  instances:
    - 'mackerel-http-checker/x.y.z'
behavior: { respects_robots_txt: false }
verification:
  # https://mackerel.io/meta/ip-ranges.json fetched live this run (200,
  # application/json, 589 bytes). The metadata-API page documents `outgoing`
  # as the IPv4 range Mackerel uses for sending and links it to the article on
  # source IP ranges for webhook notifications and external monitoring, and
  # the external-monitoring page says this monitor's source range "is the same
  # as the source IP address range for Mackerel notification requests".
  # `incoming` is deliberately not used: those are addresses Mackerel receives
  # on, not sends from. 9 IPv4 /32s and one IPv6 /56 at time of writing.
  - type: cidr_feed
    url: "https://mackerel.io/meta/ip-ranges.json"
    format: github_meta
    selector: outgoing
  - type: cidr_feed
    url: "https://mackerel.io/meta/ip-ranges.json"
    format: github_meta
    selector: outgoing_ipv6
