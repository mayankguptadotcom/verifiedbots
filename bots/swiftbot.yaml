id: swiftbot
name: Swiftbot
operator: { name: Elasticsearch B.V. (Swiftype), url: "https://swiftype.com" }
description: >-
  The web crawler behind Swiftype's site-search product, now operated by
  Elasticsearch B.V. Unlike a general search-engine crawler it only visits sites
  that Swiftype customers have asked it to crawl, in order to build a search
  index for those sites. The operator documents that Swiftbot obeys every
  restriction it finds in robots.txt, including a full-site disallow, and that
  it looks for the token Swiftbot.
docs:
  - "https://swiftype.com/swiftbot"
category: search-engine
user_agents:
  patterns:
    - 'Swiftbot/\d'
  instances:
    - 'Mozilla/5.0 (compatible; Swiftbot/1.0; UID/649dce5512ab734096a50277; +http://swiftype.com/swiftbot)'
behavior: { respects_robots_txt: true, robots_token: Swiftbot }
verification: []
