id: mistralai-user
name: MistralAI-User
operator: { name: "Mistral AI", url: "https://mistral.ai" }
description: >-
  Mistral AI's user-triggered fetcher. When someone asks Vibe a question, it may
  visit a web page to help answer and link to the source in its response.
  Mistral documents that it is not used for automatic crawling of the web, nor
  to collect content for generative AI training, and publishes the addresses it
  fetches from.
docs:
  - "https://docs.mistral.ai/robots"
category: ai-assistant
user_agents:
  patterns:
    - 'MistralAI-User/\d'
  instances:
    - 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; MistralAI-User/1.0; +https://docs.mistral.ai/robots)'
behavior: { respects_robots_txt: true, robots_token: MistralAI-User }
verification:
  - type: cidr_feed
    url: "https://mistral.ai/mistralai-user-ips.json"
    format: prefixes
