id: observepoint
name: ObservePoint
operator: { name: ObservePoint, url: "https://www.observepoint.com" }
description: >-
  ObservePoint's web-governance platform runs customer-configured audits and
  user journeys against their own sites to validate analytics and marketing
  tags. Requests come from a published set of static addresses that the operator
  states are used by ObservePoint alone, and most of its browser-based user
  agents carry the literal name "ObservePoint".
docs:
  - "https://help.observepoint.com/en/articles/9101465-allow-exclude-observepoint-traffic"
category: monitoring
user_agents:
  patterns:
    - 'ObservePoint'
  instances:
    - 'ObservePoint'
    - 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36 ObservePoint'
    - 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6_1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36 ObservePoint'
    - 'Mozilla/5.0 (X11; Linux x86_64; rv:144.0) Gecko/20100101 Firefox/144.0 ObservePoint'
behavior: { respects_robots_txt: false }
