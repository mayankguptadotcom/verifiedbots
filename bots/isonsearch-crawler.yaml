id: isonsearch-crawler
name: IsonSearchBot
operator: { name: "PT Epithre Teknologi Indonesia", url: "https://epithre.com" }
description: >-
  The crawler that builds the index behind Ison Search, an Indonesian web
  search engine that also grounds cited AI answers linking back to the
  original page. Epithre states it trains no model on what the crawler reads.
  Crawling is paced per site rather than per crawler process: it starts at two
  requests per second, speeds up only while responses stay fast and
  error-free, never exceeds about ten per second or four concurrent
  connections, halves on slow responses and 5xx, and drops to the minimum and
  pauses on 429 or 403, with robots.txt Crawl-delay always taking precedence.
  Pages whose text appears only under JavaScript are rendered in a headless
  browser that sends the same token and follows the same rules. Epithre says
  it submits no forms, attempts no authentication, reads a CAPTCHA or bot
  challenge as a refusal rather than solving or retrying past it, and fetches
  nothing behind a paywall.
docs:
  - "https://search.isonai.com/bot"
  - "https://docs.isonai.com/en/bots/"
category: search-engine
user_agents:
  # The bot page documents two versioned forms of one token ("IsonSearchBot/1.0
  # or IsonSearchBot/2.0") and states "We never present ourselves as a
  # browser"; both instances below are also arcjet's accepted instances.
  patterns:
    - 'IsonSearchBot/\d'
  instances:
    - 'IsonSearchBot/1.0 (+https://search.isonai.com/bot)'
    - 'IsonSearchBot/2.0 (+https://search.isonai.com/bot)'
behavior: { respects_robots_txt: true, robots_token: IsonSearchBot }
verification:
  # "Match the source address of the request against the list we publish."
  # Fetched live this run: 200 application/json, Google-style `prefixes`
  # shape, creationTime 2026-09-14T19:01:19Z — a published set 17 days old,
  # so it is not a fast-rotating list.
  #
  # Epithre documents one deliberate gap and the entry records it rather than
  # hiding it: one fleet node egresses through a shared mobile network and
  # that address is unpublished on purpose, because allowlisting it would
  # open a pool belonging to thousands of unrelated subscribers. The operator
  # states that node is not used to crawl sites that have allowlisted
  # IsonSearchBot, so the feed is authoritative for the traffic a site owner
  # would be verifying.
  - type: cidr_feed
    url: "https://search.isonai.com/bot/ips.json"
    format: prefixes
  # NOT attached, and the reason is an outage rather than a withdrawal — read
  # this before re-adding it, because the evidence for it is complete.
  # Epithre's bots page (docs.isonai.com/en/bots/, cited above) documents a
  # second mechanism this entry's own crawler page does not: "Both agents
  # support HTTP Message Signatures (Web Bot Auth) ... IsonSearchBot:
  # Signature-Agent is "https://search.isonai.com", with public keys in the
  # IsonSearchBot key directory", adding that "Signing is being rolled out
  # gradually". That directory —
  # https://search.isonai.com/.well-known/http-message-signatures-directory —
  # was fetched twice on 2026-10-23 (HTTP 200,
  # application/http-message-signatures-directory+json, one Ed25519 key
  # x=t_iaNPu2RFGwTpzVDF4WQssq3hI8JSWL8q_TKih0LpE) and the recipe was added.
  # Roughly twenty minutes later the entire isonai.com origin stopped
  # answering: DNS still resolves every host to 103.150.197.169, but www,
  # search and docs all fail at connect, from this sandbox (503, then
  # SSL_ERROR_SYSCALL) and from GitHub's runners ("fetch failed") alike, which
  # turned `verify-wba` — and therefore CI — red. `verify-wba` has no
  # last-known-good fallback, so the recipe was removed rather than left
  # failing the build. Re-attach it (one line) on a single successful fetch of
  # that URL.
