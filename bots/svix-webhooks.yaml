id: svix-webhooks
name: Svix Webhooks
operator: { name: Svix, url: "https://www.svix.com" }
description: >-
  Webhook-sending infrastructure used by Svix's customers to deliver events.
  Not a crawler; Pro/Enterprise plans get a documented, static set of
  per-region source IPs, and requests include a Svix sender identifier in
  the User-Agent. Svix publishes those addresses as a JSON file grouped by
  region, and notes that every webhook from its hosted service also carries
  the sender identifier sender-9YMgn.
docs:
  - "https://docs.svix.com/receiving/source-ips"
category: webhook
user_agents:
  patterns:
    - 'Svix-Webhooks/[\d.]+'
  instances:
    - 'Svix-Webhooks/1.68.0'
behavior: { respects_robots_txt: false }
verification:
  # docs.svix.com/webhook-ips.json is an object keyed by Svix region, each key
  # holding that region's sender addresses — one recipe per region. Svix states
  # the source IPs do not change for existing customers and that additions only
  # affect new customers, so a daily snapshot tracks it safely.
  - type: cidr_feed
    url: "https://docs.svix.com/webhook-ips.json"
    format: github_meta
    selector: us
  - type: cidr_feed
    url: "https://docs.svix.com/webhook-ips.json"
    format: github_meta
    selector: us-east
  - type: cidr_feed
    url: "https://docs.svix.com/webhook-ips.json"
    format: github_meta
    selector: eu
  - type: cidr_feed
    url: "https://docs.svix.com/webhook-ips.json"
    format: github_meta
    selector: au
  - type: cidr_feed
    url: "https://docs.svix.com/webhook-ips.json"
    format: github_meta
    selector: ca
