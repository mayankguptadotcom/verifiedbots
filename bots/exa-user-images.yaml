id: exa-user-images
name: ExaUser-Images
operator: { name: Exa, url: "https://exa.ai" }
description: >-
  Exa's user-triggered image fetcher, the image counterpart of ExaUser. It
  retrieves an image live when a person, or an application built on the Exa
  API, asks for it. The operator documents it as separate from
  ExaSearchBot-Images: it does no scheduled or background crawling, it is not
  used to decide whether content appears in Exa search, and each fetch is a
  single GET for the image URL with the image reduced to at most 560 pixels on
  its longest side before it is returned. Requests are signed with Web Bot Auth.
docs:
  - "https://exauser-images.crawler.exa.ai/"
category: ai-assistant
user_agents:
  # The operator page's "User-agent" section prints the bare token as the
  # complete string. The sibling 'ExaUser/\d' pattern does not match it.
  patterns:
    - 'ExaUser-Images'
  instances:
    - 'ExaUser-Images'
# "Because fetches are initiated by a user, robots.txt rules may not apply" —
# the operator's own words. Exa directs search opt-outs to the ExaSearchBot
# token instead, so no robots_token is recorded here.
behavior: { respects_robots_txt: false }
verification:
  # "Every request is signed with Web Bot Auth (RFC 9421) ... Keys are
  # published at
  # https://exauser-images.crawler.exa.ai/.well-known/http-message-signatures-directory".
  # Fetched live this session: HTTP 200, content-type
  # application/http-message-signatures-directory+json, one Ed25519 key, and a
  # different kid from each of Exa's three other directories.
  - type: web_bot_auth
    signature_agent_url: "https://exauser-images.crawler.exa.ai/.well-known/http-message-signatures-directory"
