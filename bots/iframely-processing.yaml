id: iframely-processing
name: Iframely Processing Agent
operator: { name: Iframely, url: "https://iframely.com" }
description: >-
  Iframely's processing agent, a separate identity for the automated-processing
  requests its customers make through the Iframely API — indexing, search,
  AI-assisted retrieval and AI input. Iframely documents it as request-driven,
  one URL at a time on behalf of a specific customer request, and explicitly
  scoped against training use, which goes out as the Iframely Training Agent
  instead. Every request is signed with Web Bot Auth and carries a Forwarded
  header naming the customer behind it.
docs:
  - "https://iframely.com/docs/about-processing"
  - "https://iframely.com/docs/allowlisting"
category: ai-assistant
user_agents:
  patterns:
    - 'Iframely-Processing/[\d.]+'
  instances:
    - 'Iframely-Processing/1.3.1 (+https://iframely.com/docs/about-processing)'
# "Unlike the Preview Agent, it does check your robots.txt before fetching
# anything, following RFC 9309" — /docs/about-processing. /docs/content-policy
# adds that it holds off entirely while robots.txt is unavailable. No
# `User-agent:` token is documented anywhere on those pages (the operator
# directs targeting at the UA string and its own headers), so robots_token is
# omitted rather than guessed.
behavior: { respects_robots_txt: true }
verification:
  # /docs/allowlisting: "All three Iframely agents sign their requests using
  # this standard [Web Bot Authentication] ... The signature host resolves to
  # iframely.com". Fetched live this session: HTTP 200, content-type
  # application/http-message-signatures-directory+json, one Ed25519 key.
  - type: web_bot_auth
    signature_agent_url: "https://iframely.com/.well-known/http-message-signatures-directory"
  # Same two gateway lists as the Preview Agent — /docs/allowlisting states the
  # page "applies identically across all three Iframely agents". Both fetched
  # live this session: text/plain, 25 IPv4 /32s and one IPv6 /56.
  - type: cidr_feed
    url: "https://iframely.com/ips-v4"
    format: text_lines
  - type: cidr_feed
    url: "https://iframely.com/ips-v6"
    format: text_lines
  # "Iframely traffic resolves to a subdomain of iframely.com. Reverse DNS
  # reliably verifies IPv4 traffic only."
  - type: rdns
    masks: ["*.iframely.com"]
