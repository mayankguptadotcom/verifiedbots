id: coveo-crawler
name: Coveobot
operator: { name: Coveo, url: "https://www.coveo.com" }
description: >-
  Crawler behind Coveo's hosted Web source, which indexes a customer's website
  into a Coveo search organization. Coveo documents the default User-Agent
  string and publishes the egress IP addresses of its cloud crawlers for every
  deployment region, so requests can be attributed to the operator.
docs:
  - "https://docs.coveo.com/en/malf0160/"
  - "https://docs.coveo.com/en/n1ab5310/index-content/troubleshooting-web-source-issues"
  - "https://docs.coveo.com/en/1831/"
category: search-engine
user_agents:
  patterns:
    - 'Coveobot/[\d.]+'
  instances:
    # Quoted verbatim on the troubleshooting page as "the Coveo crawler user
    # agent string". The +http://www.coveo.com/bot.html URL the string
    # advertises 404s (checked this session), so it is not cited as a docs URL.
    - 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko) (compatible; Coveobot/2.0;+http://www.coveo.com/bot.html)'
# The Web source honours robots.txt page restrictions and crawl-delay (the
# slowest value wins), per the "Add a Web source" page; visit-time and
# request-rate are documented as unsupported. The same page documents a
# customer-settable "robots.txt" override box that makes the crawler ignore
# those directives for the site being indexed. No robots User-agent token is
# documented anywhere, so robots_token is omitted rather than guessed.
behavior: { respects_robots_txt: true }
verification:
  # "IP addresses to allowlist" lists these as the addresses Coveo's cloud
  # crawlers connect from, grouped by the organization's deployment region, and
  # tells readers to use the /32 suffix because a shorter prefix "would result
  # in allowing a larger range ... allowing other AWS clients". Transcribed
  # verbatim from the page this session; 42 addresses across five regions.
  # Not covered here: the on-premises Crawling Module (Maestro), which the
  # customer hosts, so its requests come from customer addresses and are not
  # attributable to Coveo.
  - type: static_cidrs
    cidrs:
      # US organizations
      - "54.84.109.253/32"
      - "54.84.122.250/32"
      - "54.84.126.201/32"
      - "54.84.126.206/32"
      - "54.89.203.159/32"
      - "34.228.114.92/32"
      - "52.1.174.164/32"
      - "34.206.208.119/32"
      - "54.147.101.56/32"
      - "3.143.63.87/32"
      - "18.218.102.25/32"
      - "18.218.142.66/32"
      - "3.129.199.205/32"
      - "18.222.105.207/32"
      - "3.143.72.156/32"
      # Canadian organizations
