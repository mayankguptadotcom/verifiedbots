id: pipl-crawler
name: PiplBot
operator: { name: Pipl, url: "https://pipl.com" }
description: >-
  PiplBot is the web-indexing crawler operated by Pipl, an identity and
  people-search service. It retrieves and indexes publicly available
  information, including content behind searchable databases, to build Pipl's
  people-search index.
docs:
  # Pipl's bot page 404s as of 2026-09-27 (both /bot and /bot/; pipl.com itself
  # answers 200 and no replacement page could be located). The URL is kept
  # because it is the one PiplBot's own user agent advertises and is the source
  # the fields below were taken from; re-check before relying on it.
  - "https://pipl.com/bot/"
category: search-engine
user_agents:
  patterns:
    - 'PiplBot'
  instances:
    - 'PiplBot (+http://www.pipl.com/bot/)'
    - 'Mozilla/5.0+(compatible;+PiplBot;+http://www.pipl.com/bot/)'
behavior: { respects_robots_txt: true, robots_token: PiplBot }
verification: []
