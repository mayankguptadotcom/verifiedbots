id: watchforbot
name: WatchForBot
operator: { name: WatchFor, url: "https://watchfor.io" }
description: >-
  WatchFor's monitoring probe, which checks that websites, APIs, servers and
  certificates its customers have configured are healthy, from fixed locations
  worldwide. It performs only the specific check each monitor defines and does
  not crawl sites, follow links or harvest content. WatchFor publishes a
  machine-readable address list and forward-confirmed reverse DNS under
  probe.watchfor.io so site owners can tell a genuine probe from a spoofed
  user agent, and also signs every probe with an Ed25519 key under the Web Bot
  Auth profile of RFC 9421 HTTP message signatures.
docs:
  - "https://watchfor.io/bot"
category: monitoring
user_agents:
  patterns:
    - 'WatchForBot/\d'
  instances:
    - 'Mozilla/5.0 (compatible; WatchForBot/1.0; +https://watchfor.io/bot)'
behavior: { respects_robots_txt: false }
verification:
  - type: cidr_feed
    url: "https://watchfor.io/ips.json"
    format: prefixes
  - type: rdns
    masks: ["*.probe.watchfor.io"]
  # Signature-Agent: "https://watchfor.io"; the page states the public keys are
  # published at /.well-known/http-message-signatures-directory, which serves
  # the fleet's Ed25519 key (kid watchfor-probes-2026).
  - type: web_bot_auth
    signature_agent_url: "https://watchfor.io/.well-known/http-message-signatures-directory"
