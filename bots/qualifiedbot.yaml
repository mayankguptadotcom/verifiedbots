id: qualifiedbot
name: QualifiedBot
operator: { name: Qualified, url: "https://www.qualified.com" }
description: >-
  Qualified's crawler. It crawls customer websites to power Qualified's AI
  products, such as its AI SDR, during initial setup, on major feature releases
  and on a schedule the customer's Qualified representative sets. The operator
  publishes the three source addresses its crawlers request from and asks site
  owners to allow-list them.
docs:
  - "https://www.qualified.com/legal/qualified-crawler-user-agent"
  - "https://www.qualified.com/legal/bot-ip-addresses"
category: ai-crawler
user_agents:
  patterns:
    - 'QualifiedBot/\d'
  instances:
    - 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.6668.29 QualifiedBot/1.0 +https://www.qualified.com/legal/qualified-crawler-user-agent Safari/537.36'
    - 'Mozilla/5.0 (compatible; QualifiedBot/1.0; +https://www.qualified.com/legal/qualified-crawler-user-agent)'
behavior: { respects_robots_txt: false }
verification:
  - type: static_cidrs
    cidrs:
      - "3.92.37.95/32"
      - "34.236.78.183/32"
      - "52.20.17.105/32"
