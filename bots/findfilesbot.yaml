id: findfilesbot
name: FindFilesBot
operator: { name: FindFiles.net, url: "https://findfiles.net" }
description: >-
  The crawler behind the FindFiles.net file search engine. It checks that
  publicly accessible files users search for are still available, using
  multiplexed HTTP/2 HEAD requests with a minimum ten-second interval per
  server, and may download images, videos and executables for classification
  and safety checks. Purpose-specific user agents are published for its link
  checking, favicon fetching, virus scanning and image classification agents,
  which all share one crawler host and address. The operator publishes those
  addresses as a plain-text list.
docs:
  - "https://findfiles.net/en/bot"
category: search-engine
user_agents:
  patterns:
    - 'FindFilesBot/\d'
    - 'FindFiles\.net-[A-Za-z]+/\d'
  instances:
    - 'FindFilesBot/1.0 (+https://findfiles.net/en/bot)'
    - 'FindFiles.net-LinkChecker/1.1 https://findfiles.net/bot'
    - 'FindFiles.net-FaviconFetcher/1.0 (+https://findfiles.net/bot)'
    - 'FindFiles.net-VirusScan/1.0 (+https://findfiles.net/bot)'
    - 'FindFiles.net-ImageNSFWClassifier/1.0 (+https://findfiles.net/bot)'
behavior: { respects_robots_txt: false }
verification:
  # The bot page asks "Need our crawler IP addresses in plain text?" and links
  # this file as the "public IP list [that] includes FindFilesBot's IPv4 and
  # IPv6 addresses for verification and network configuration". Fetched live
  # this session: 200, text/plain, the same two bare addresses the page prints
  # in its identity table, which the snapshot this replaces held statically.
  - type: cidr_feed
    url: "https://findfiles.net/bot-ips.txt"
    format: text_lines
  # The operator tells site owners to confirm that reverse DNS points to the
  # crawler hostname bot.findfiles.net and that the hostname resolves back to
  # the same address. The PTR for 65.21.31.180 was confirmed on 2026-11-03 and
  # the bot page still documents the same hostname; reverse DNS is not
  # resolvable from the research sandbox, so it was not re-checked on
  # 2026-11-27.
  - type: rdns
    masks: ["*.findfiles.net"]
