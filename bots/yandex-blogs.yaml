id: yandex-blogs
name: YandexBlogs
operator: { name: Yandex, url: "https://yandex.com" }
description: >-
  Yandex's blog-search robot. Yandex's robot table documents it as the blog
  search robot that indexes post comments, and lists it as following
  robots.txt directives.
docs:
  - "https://yandex.com/support/webmaster/robot-workings/check-yandex-robots.html"
category: search-engine
user_agents:
  patterns:
    - 'YandexBlogs/[\d.]+'
  instances:
    - 'Mozilla/5.0 (compatible; YandexBlogs/0.99; robot; +http://yandex.com/bots)'
behavior: { respects_robots_txt: true, robots_token: YandexBlogs }
verification:
  - type: rdns
    masks: ["*.yandex.ru", "*.yandex.net", "*.yandex.com"]
