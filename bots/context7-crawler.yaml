id: context7-crawler
name: Context7-Crawler
operator: { name: Upstash, url: "https://context7.com" }
description: >-
  Context7's documentation crawler, an Upstash project. It reads public
  documentation pages so that AI coding agents can retrieve and cite them, and
  the operator states the content is used for AI search with links back to the
  source rather than for model training. Requests are signed with HTTP Message
  Signatures (RFC 9421) under the Web Bot Auth scheme.
docs:
  - "https://context7.com/crawler"
category: ai-crawler
user_agents:
  patterns:
    - 'Context7-Crawler/\d'
  instances:
    - 'Context7-Crawler/1.0 (+https://context7.com/crawler)'
behavior: { respects_robots_txt: true, robots_token: Context7-Crawler }
verification:
  - type: web_bot_auth
    signature_agent_url: "https://context7.com/.well-known/http-message-signatures-directory"
