id: claritybot
name: Claritybot
operator: { name: seoClarity, url: "https://www.seoclarity.net" }
description: >-
  seoClarity's page and site audit crawler. Crawls are triggered on demand by
  seoClarity clients to analyse pages for technical and content issues, and
  clients can also schedule daily managed page crawls. The operator documents
  that it obeys robots.txt and Crawl-delay, and that its addresses are dynamic.
docs:
  - "https://www.seoclarity.net/bot.html"
category: seo
user_agents:
  patterns:
    - 'ClarityBot/\d'
  instances:
    - 'Mozilla/5.0 (compatible; ClarityBot/9.0; +https://www.seoclarity.net/bot.html)'
    - 'Mozilla/5.0 (Linux; Android 9; SM-G960F Build/PPR1.180610.011; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/74.0.3729.157 Mobile Safari/537.36 (compatible; ClarityBot/9.0; +https://www.seoclarity.net/bot.html)'
behavior: { respects_robots_txt: true, robots_token: claritybot }
verification: []
