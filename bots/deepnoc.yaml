id: deepnoc
name: deepnoc
operator: { name: deepnoc GmbH, url: "https://deepnoc.com" }
description: >-
  Research crawler operated by deepnoc GmbH that parses and stores public web
  page content so that new search engines can query it without running their own
  crawling infrastructure. No IP ranges are published.
docs:
  - "https://deepnoc.com/bot"
category: search-engine
user_agents:
  patterns:
    - 'deepnoc'
  instances:
    - 'deepnoc - https://deepnoc.com/bot'
behavior: { respects_robots_txt: true, robots_token: deepnoc }
verification: []
