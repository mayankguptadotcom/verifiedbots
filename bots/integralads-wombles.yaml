id: integralads-wombles
name: IAS Wombles
operator: { name: Integral Ad Science, url: "https://integralads.com/" }
description: >-
  The second crawler Integral Ad Science documents alongside IAS Crawler. IAS
  says Wombles captures additional information used to refine its invalid
  traffic models, as distinct from the content-rating work IAS Crawler does.
  Both robots are covered by the same public IP list IAS publishes.
docs:
  - "https://integralads.com/site-indexing-policy/"
category: seo
user_agents:
  patterns:
    - 'ias_wombles'
  instances:
    - 'IAS Wombles (ias_wombles; http://integralads.com/site-indexing-policy/)'
behavior: { respects_robots_txt: true, robots_token: ias_wombles }
verification:
  # "IAS publishes the public-facing IP addresses that our robots crawl from"
  # — the JSON file linked from the indexing policy page, fetched live this
  # session: HTTP 200, application/json, a `publicIPs` array of 31
  # single-address objects ({"ipv4": "3.217.168.199"}). Read with the
  # `ip_objects` format, which was added this session for exactly this shape;
  # the 31 addresses it yields are identical to the snapshot that stood here
  # before, so this replaces the hand-copied list rather than changing it.
  - type: cidr_feed
    url: "https://integralads.com/policy-docs/iasbot.json"
    format: ip_objects
    selector: publicIPs
