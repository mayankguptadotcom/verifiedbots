id: duckassistbot
name: DuckAssistBot
operator: { name: DuckDuckGo, url: "https://duckduckgo.com" }
description: >-
  DuckDuckGo's real-time fetcher for DuckDuckGo Search's AI-assisted answers,
  which cite their sources. DuckDuckGo states the data is not used to train AI
  models, and publishes a machine-readable list of the bot's IP addresses.
docs:
  - "https://duckduckgo.com/duckduckgo-help-pages/results/duckassistbot/"
category: ai-assistant
user_agents:
  patterns:
    - 'DuckAssistBot/\d'
  instances:
    - 'DuckAssistBot/1.2; (+http://duckduckgo.com/duckassistbot.html)'
behavior: { respects_robots_txt: true, robots_token: DuckAssistBot }
verification:
  - type: cidr_feed
    url: "https://duckduckgo.com/duckassistbot.json"
    format: prefixes
  # Web Bot Auth directory declared by arcjet/well-known-bots and fetched live
  # this run (200, application/http-message-signatures-directory+json, one
  # Ed25519 key) on DuckDuckGo's own assistbot subdomain. DuckDuckGo's help
  # page documents the UA and IP feed but does not itself mention signing, so
  # re-check it for an operator statement.
  - type: web_bot_auth
    signature_agent_url: "https://assistbot.duckduckgo.com/.well-known/http-message-signatures-directory"
