id: domcopbot
name: DomCopBot
operator: { name: DomCop, url: "https://www.domcop.com" }
description: >-
  The crawler behind DomCop's domain-research service. DomCop members ask it to
  crawl websites of their choice; it reads those pages, follows links to the
  depth the member chose and checks the domain behind every outgoing link to
  find expired domains, recording only the domain names of links that lead
  nowhere. It also reads a domain's robots.txt once per domain to establish
  whether a site is still live there. The operator documents robots.txt and
  Crawl-delay support, a minimum three seconds between requests to the same
  host, HTML-only fetches capped at 2 MB, and the single address the crawler
  requests from.
docs:
  - "https://www.domcop.com/bot"
category: seo
user_agents:
  patterns:
    - 'DomCopBot'
  instances:
    - 'DomCopBot (https://www.domcop.com/bot)'
behavior: { respects_robots_txt: true, robots_token: DomCopBot }
verification:
  # The bot page's "Verifying the DomCop Bot" section states that genuine
  # requests come only from this address, which the operator says it keeps
  # current: "Crawl address: 45.79.173.72 (crawler.domcop.com)".
  - type: static_cidrs
    cidrs:
      - "45.79.173.72/32"
  # No rdns recipe on purpose. The page claims forward-confirmed reverse DNS,
  # and the reverse half checks out (45.79.173.72 -> crawler.domcop.com on both
  # the Google and Cloudflare resolvers this session), but the forward half does
  # not: crawler.domcop.com has no A record (NXDOMAIN on both resolvers), so an
  # FCrDNS check against the claimed hostname would reject the operator's own
  # traffic. Re-test before attaching a mask.
