id: halo-security
name: Halo Security
operator: { name: Halo Security, url: "https://www.halosecurity.com" }
description: >-
  The scanning engine of Halo Security's attack-surface-management platform,
  which probes web applications a customer has added as a target to find
  vulnerabilities and inventory their external assets. Halo Security documents
  that it appends the string vuln_scan_by_trustedsite_com_halo_security to the
  User-Agent header so site owners can tell its traffic apart, and publishes
  the network ranges its scanners and web-preview "webshot" service originate
  from. It scans only customer-configured targets rather than crawling the
  open web, so Halo Security documents no robots.txt handling for it.
docs:
  - "https://docs.halosecurity.com/docs/platform/targets/scan-configuration"
category: security
user_agents:
  patterns:
    - 'vuln_scan_by_trustedsite_com_halo_security'
  instances:
    - 'Mozilla/5.0 (Macintosh; U; Intel Mac OS X 10_10_3; en-us) AppleWebKit/600.6.3 (KHTML, like Gecko) Chrome/69.0.3497.100 Safari/600.6.3 vuln_scan_by_trustedsite_com_halo_security'
behavior:
  respects_robots_txt: false
verification:
  - type: static_cidrs
    cidrs:
      - "3.18.82.183/32"
      - "54.187.125.96/32"
      - "64.39.96.0/20"
      - "74.82.62.128/26"
      - "139.87.112.0/23"
