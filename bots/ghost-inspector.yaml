id: ghost-inspector
name: Ghost Inspector
operator: { name: Ghost Inspector, url: "https://ghostinspector.com" }
description: >-
  Ghost Inspector runs customer-authored browser tests against the sites their
  owners point it at, from a fixed pool of cloud test runners in 18 regions. Its
  runners append the literal string "Ghost Inspector" to the browser user agent
  they run, and the operator publishes the full list of test-runner addresses so
  site owners can filter the traffic out of their analytics.
docs:
  - "https://docs.ghostinspector.com/faq/"
  - "https://docs.ghostinspector.com/public-api/test-runner-ip-addresses/"
category: monitoring
user_agents:
  patterns:
    - 'Ghost Inspector'
  instances:
    - 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/63.0 Safari/537.36 Ghost Inspector'
    - 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/107.0 Safari/537.36 Ghost Inspector (63c85ddbde52d6697f57c623)'
behavior: { respects_robots_txt: false }
verification:
