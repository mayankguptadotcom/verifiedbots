id: yandex-tracker
name: YandexTracker
operator: { name: Yandex, url: "https://yandex.com" }
description: >-
  The robot of Yandex Tracker, Yandex's work-management service. Yandex's
  robot table lists it among the robots that download web documents for
  purposes other than indexing, and records that it does not follow the
  general robots.txt rules.
docs:
  - "https://yandex.com/support/webmaster/robot-workings/check-yandex-robots.html"
category: feed-fetcher
user_agents:
  patterns:
    - 'YandexTracker/\d'
  instances:
    - 'Mozilla/5.0 (compatible; YandexTracker/1.0; +http://yandex.com/bots)'
behavior: { respects_robots_txt: false }
verification:
  - type: rdns
    masks: ["*.yandex.ru", "*.yandex.net", "*.yandex.com"]
