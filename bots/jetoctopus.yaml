id: jetoctopus
name: JetOctopus
operator: { name: JetOctopus, url: "https://jetoctopus.com" }
description: >-
  Cloud SEO crawler and log analyzer that crawls the sites its customers
  configure. Its regular user agent is the JetOctopus token recorded here; the
  crawl configuration also offers desktop browser, mobile browser and
  Googlebot desktop/mobile strings so a customer can see how their own site
  renders for those clients, and in those modes the requests are not
  distinguishable by user agent, only by source address. Robots.txt rules are
  followed when the crawl's "Respect robots rules" setting is on, which is why
  the flag below is false, and JetOctopus publishes the servers it crawls
  from so site owners can allowlist them.
docs:
  - "https://jetoctopus.com/a-complete-list-of-user-agents-used-by-jetoctopus/"
  - "https://jetoctopus.com/how-does-the-jetoctopus-crawler-work/"
category: seo
user_agents:
  patterns:
    - 'JetOctopus/[\d.]+'
  instances:
    - 'Mozilla/5.0 (compatible; JetOctopus/0.1; +https://jetoctopus.com/)'
behavior: { respects_robots_txt: false }
verification:
  # The "Crawling Servers" list on the operator's user-agent page. Five
  # documented addresses and no feed URL, so they are snapshotted rather than
  # fetched. These are also the addresses that distinguish a JetOctopus crawl
  # running under a Googlebot user agent from the real Googlebot.
  - type: static_cidrs
    cidrs:
      - "54.38.81.9/32"
      - "198.244.200.110/32"
      - "57.129.76.223/32"
      - "147.135.5.64/32"
      - "139.99.131.40/32"
