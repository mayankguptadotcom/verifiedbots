id: amazon-bedrock-crawler
name: Amazon Bedrock Web Crawler
operator: { name: Amazon, url: "https://aws.amazon.com" }
description: >-
  The web crawler AWS runs for Amazon Bedrock Knowledge Bases, which fetches
  the site URLs an AWS customer has configured as a data source and ingests
  the pages into that customer's knowledge base. Like Google-CloudVertexBot it
  is customer-directed but operator-run: the requests come from Amazon's
  infrastructure, and AWS requires the customer to confirm they are authorised
  to crawl the domains they supply. AWS documents that the crawler follows
  robots.txt per RFC 9309 and that it defaults to disallow when a site serves
  no robots.txt at all.
docs:
  - "https://docs.aws.amazon.com/bedrock/latest/userguide/webcrawl-data-source-connector.html"
  - "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-webcrawler.html"
category: ai-crawler
user_agents:
  # Two connectors, two documented identities, both recorded exactly as AWS
  # prints them. The customer-managed connector is addressed in robots.txt as
  # `bedrockbot-UUID` with a fallback to a generic `bedrockbot` rule, where
  # UUID is the data source's own identifier; the managed connector "identifies
  # itself with the user-agent string amazon-bedrock-knowledgebase-on-behalf-of-<hash>".
  # The UUID/hash varies per knowledge base, so both patterns anchor on the
  # fixed prefix rather than on a whole string.
  patterns:
    - 'bedrockbot'
    - 'amazon-bedrock-knowledgebase-on-behalf-of'
  instances:
    - 'bedrockbot-UUID'
    - 'amazon-bedrock-knowledgebase-on-behalf-of-<hash>'
behavior: { respects_robots_txt: true, robots_token: bedrockbot }
# AWS publishes no crawler-specific IP list — ip-ranges.json covers all of AWS
# and would attribute any EC2 tenant's traffic to this bot, so no recipe is
# attached and the entry is Tier 3 on identity alone.
verification: []
