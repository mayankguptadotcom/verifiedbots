id: yandex-imageresizer
name: YandexImageResizer
operator: { name: Yandex, url: "https://yandex.com" }
description: >-
  A Yandex robot that Yandex's robot table describes as the mobile devices
  robot, listed alongside YandexImages and recorded as following the general
  robots.txt rules.
docs:
  - "https://yandex.com/support/webmaster/robot-workings/check-yandex-robots.html"
category: search-engine
user_agents:
  patterns:
    - 'YandexImageResizer/\d'
  instances:
    - 'Mozilla/5.0 (compatible; YandexImageResizer/2.0; +http://yandex.com/bots)'
behavior: { respects_robots_txt: true, robots_token: YandexImageResizer }
verification:
  - type: rdns
    masks: ["*.yandex.ru", "*.yandex.net", "*.yandex.com"]
