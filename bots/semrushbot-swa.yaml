id: semrushbot-swa
name: SemrushBot-SWA
operator: { name: Semrush, url: "https://www.semrush.com" }
description: >-
  The fetcher Semrush's SEO Writing Assistant uses to check whether a URL is
  accessible. Semrush documents it as its own robots.txt user agent, separate
  from the SemrushBot backlink crawler, and publishes no IP ranges for it.
docs:
  - "https://www.semrush.com/bot/"
category: seo
user_agents:
  patterns:
    - 'SemrushBot-SWA'
  instances:
    - 'SemrushBot-SWA'
behavior: { respects_robots_txt: true, robots_token: SemrushBot-SWA }
verification: []
