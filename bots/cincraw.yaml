id: cincraw
name: Cincraw
operator: { name: "CINC Corp. (株式会社CINC)", url: "https://www.cinc-j.co.jp" }
description: >-
  The web crawler operated by CINC, a Japanese data-solutions company, to
  collect the page data behind its marketing and SEO analytics products. Its
  documented policy is to fetch page body content, header and HTTP status
  information and the JS/CSS needed to render a page, then store a rendered
  screen capture. CINC states that it does not follow advertising links,
  deletes all cookies between requests, and does not load analytics or
  ad-measurement tags. No robots.txt policy and no IP ranges are published.
docs:
  # 2026-10-01: cincrawdata.net no longer resolves from this egress — DNS
  # fails for both the apex and www, and http:// and https:// both fail to
  # connect, where the same sweep reached 293 other cited pages. The URL is
  # kept because it is the one Cincraw's own user agent advertises and the
  # source every field here was taken from (same call as pipl-crawler and
  # bombora-crawler on 2026-09-27). The operator itself is still live:
  # www.cinc-j.co.jp answered 200 on the same run. Re-probe next run; if the
  # host stays dead, a human may want to decide whether an entry whose only
  # documentation has vanished should stay listed.
  - "https://cincrawdata.net/bot/"
category: seo
user_agents:
  patterns:
    - 'Cincraw/[\d.]+'
  instances:
    - 'Mozilla/5.0 (compatible; Cincraw/1.0; +http://cincrawdata.net/bot/)'
behavior: { respects_robots_txt: false }
verification: []
