id: ahrefsbot
name: AhrefsBot
operator: { name: Ahrefs, url: "https://ahrefs.com" }
description: >-
  Ahrefs' primary web crawler, powering the backlink and keyword database
  behind the Ahrefs SEO platform and the Yep search engine. Crawls from
  publicly published IP ranges with a matching reverse-DNS suffix.
docs:
  - "https://ahrefs.com/robot"
category: seo
user_agents:
  patterns:
    - 'AhrefsBot/\d'
  instances:
    - 'Mozilla/5.0 (compatible; AhrefsBot/7.0; +http://ahrefs.com/robot/)'
behavior: { respects_robots_txt: true, robots_token: AhrefsBot }
verification:
  - type: cidr_feed
    url: "https://api.ahrefs.com/v3/public/crawler-ip-ranges"
    format: prefixes
  # "The reverse DNS suffix of the IPs hostname is always ahrefs.com or
  # ahrefs.net" — quoted from the operator's bot page, re-read in full this
  # run. Not forward-confirmed here: this environment has no working reverse
  # resolver (no dig/host/nslookup, and socket.gethostbyaddr fails even for
  # 8.8.8.8), so the masks rest on the operator's statement alone.
  - type: rdns
    masks: ["*.ahrefs.com", "*.ahrefs.net"]
  # Web Bot Auth directory declared for this crawler by arcjet/well-known-bots
  # (`ahrefs-crawler`, pattern `AhrefsBot/`) and fetched live this session: HTTP
  # 200, content-type application/http-message-signatures-directory+json,
  # 298 bytes of Ed25519 JWKS. This host has been in the candidate ledger's
  # "held" set since 2026-10-15 on the rule that a directory found by a sweep
  # is not a recipe unless the operator documents signing — but arcjet is an
  # acceptable source in its own right under iron rule 1(b), and it names this
  # bot and this URL explicitly, which a bare sweep hit does not. Ahrefs' own
  # bot page still documents only the address feed and the reverse-DNS suffix
  # above, so the tier is unchanged either way (already Tier 1 on the feed).
  # arcjet declares no directory for AhrefsSiteAudit, so that entry gets none.
  - type: web_bot_auth
    signature_agent_url: "https://ahrefs.com/.well-known/http-message-signatures-directory"
