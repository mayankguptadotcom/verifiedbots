id: integralads-crawler
name: IAS Crawler
operator: { name: Integral Ad Science, url: "https://integralads.com/" }
description: >-
  Content-rating and ad-verification crawler operated by Integral Ad Science.
  It visits web pages to assess content quality and brand safety and to support
  invalid-traffic detection for advertisers. IAS publishes the public-facing
  addresses its robots crawl from as a JSON file linked from its indexing
  policy, which this directory reads as a live feed.
docs:
  - "https://integralads.com/site-indexing-policy/"
category: seo
user_agents:
  patterns:
    - 'ias_crawler'
  instances:
    - 'IAS Crawler (ias_crawler; http://integralads.com/site-indexing-policy/)'
behavior: { respects_robots_txt: true, robots_token: ias_crawler }
verification:
  # "IAS publishes the public-facing IP addresses that our robots crawl from"
  # — the JSON file linked from the indexing policy page, fetched live this
  # session: HTTP 200, application/json, a `publicIPs` array of 31
  # single-address objects ({"ipv4": "3.217.168.199"}). Read with the
  # `ip_objects` format, which was added this session for exactly this shape;
  # the 31 addresses it yields are identical to the snapshot that stood here
  # before, so this replaces the hand-copied list rather than changing it.
  - type: cidr_feed
    url: "https://integralads.com/policy-docs/iasbot.json"
    format: ip_objects
    selector: publicIPs
