id: digitalocean-gradient-ai-crawler
name: DigitalOcean Gradient AI Website Crawler
operator: { name: "DigitalOcean, LLC", url: "https://www.digitalocean.com" }
description: >-
  The crawler DigitalOcean runs when a customer adds a website URL as a data
  source for a DigitalOcean Knowledge Base, which indexes the content so it can
  power retrieval-augmented generation for that customer's own agents. The
  documentation states the crawler indexes up to 5,500 pages per job and skips
  inaccessible or disallowed links to keep indexing jobs bounded, follows HTML
  links depending on the behaviour the customer selects, indexes text and
  certain image types, and ignores videos and navigation links.
docs:
  - "https://docs.digitalocean.com/products/knowledge-bases/details/website-crawler/"
  - "https://docs.digitalocean.com/products/inference/details/website-crawler/"
category: ai-crawler
user_agents:
  # Both operator pages name the agent exactly once and identically: "DigitalOcean
  # uses a custom agent named DigitalOceanGradientAICrawler/1.0 to index the
  # website content". That documented string is recorded as both pattern and
  # instance — the same treatment amazon-kendra-crawler gives its token — because
  # neither page prints a full User-Agent header and arcjet has no record of it.
  patterns:
    - 'DigitalOceanGradientAICrawler'
  instances:
    - 'DigitalOceanGradientAICrawler/1.0'
# "It respects the website's robots.txt rules, including any Disallow directives
# or the wildcard *." No robots_token is recorded: neither page prints a
# `User-agent:` line, so the token would be an inference from the agent name.
behavior: { respects_robots_txt: true }
# No crawler-specific IP list, ASN or rDNS convention anywhere in the
# Knowledge Bases or Inference docs — DigitalOcean's platform ranges cover every
# Droplet tenant — so this is Tier 3 on identity alone.
verification: []
