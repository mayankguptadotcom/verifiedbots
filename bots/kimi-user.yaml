id: kimi-user
name: Kimi-User
operator: { name: Moonshot AI, url: "https://www.moonshot.ai" }
description: >-
  Moonshot AI's user-triggered fetcher for Kimi, which retrieves a page when a
  person asks Kimi to summarise it or answers a question needing live web
  retrieval. Moonshot states it is not used for automated bulk crawling and
  that, because the actions are user-triggered, robots.txt rules may not
  directly apply.
docs:
  - "https://www.kimi.ai/policies/kimi-crawlers"
category: ai-assistant
user_agents:
  patterns:
    - 'Kimi-User/\d'
  instances:
    - 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; Kimi-User/1.0; +https://www.kimi.com/policies/kimi-crawlers'
behavior: { respects_robots_txt: false }
verification:
  - type: cidr_feed
    url: "https://www.kimi.ai/policies/kimi-user.json"
    format: prefixes
