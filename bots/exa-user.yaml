id: exa-user
name: ExaUser
operator: { name: Exa, url: "https://exa.ai" }
description: >-
  Exa's user-triggered fetcher, which retrieves a page live when a person, or an
  application built on the Exa API, asks for its current content. Exa documents
  it as separate from ExaSearchBot: it does not crawl automatically, it does no
  scheduled or background fetching, and it is not used to decide whether content
  appears in Exa search. Requests are signed with Web Bot Auth.
docs:
  - "https://exauser.crawler.exa.ai/"
category: ai-assistant
user_agents:
  patterns:
    - 'ExaUser/\d'
  instances:
    # The string the operator page prints today, after Exa moved the agent's
    # documentation to its own host. The previous +URL is kept because requests
    # carrying it may still be in logs; 'ExaUser/\d' matches both.
    - 'Mozilla/5.0 (compatible; ExaUser/1.0; +https://exauser.crawler.exa.ai)'
    - 'Mozilla/5.0 (compatible; ExaUser/1.0; +https://crawler.exa.ai/exauser)'
# "Because fetches are initiated by a user, robots.txt rules may not apply" —
# the operator's own statement on the page above. Exa directs search opt-outs
# to the ExaSearchBot token instead, so no robots_token is recorded here.
behavior: { respects_robots_txt: false }
verification:
  # "Every request is signed with Web Bot Auth (RFC 9421) ... Keys are published
  # at https://exauser.crawler.exa.ai/.well-known/http-message-signatures-directory".
  # Exa has split its key directories per agent: this run re-read the ExaUser
  # page (which crawler.exa.ai/exauser now redirects to) and it names a
  # directory of ExaUser's own, no longer ExaSearchBot's. Fetched live this
  # session: HTTP 200, content-type
  # application/http-message-signatures-directory+json, one Ed25519 key, with a
  # different kid from the ExaSearchBot directory.
  - type: web_bot_auth
    signature_agent_url: "https://exauser.crawler.exa.ai/.well-known/http-message-signatures-directory"
