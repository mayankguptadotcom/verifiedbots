id: easycron
name: EasyCron
operator: { name: EasyCron, url: "https://www.easycron.com" }
description: >-
  Hosted cron service that calls URLs its users schedule, on the interval or
  cron expression they configure. Requests go only to endpoints the user
  entered, and EasyCron publishes the IPv4 and IPv6 addresses its execution
  bots call from as a JSON list.
docs:
  - "https://www.easycron.com/faq/What-user-agent-is-EasyCron-using"
  - "https://www.easycron.com/ips"
category: webhook
user_agents:
  patterns:
    - 'EasyCron/[\d.]+'
  instances:
    - 'EasyCron/1.0 (https://www.easycron.com/)'
behavior: { respects_robots_txt: false }
verification:
  - type: cidr_feed
    url: "https://www.easycron.com/ips.json"
    format: github_meta
    selector: ipv4
  - type: cidr_feed
    url: "https://www.easycron.com/ips.json"
    format: github_meta
    selector: ipv6
